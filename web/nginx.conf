server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:4000;   # a service name from docker-compose.yml
  }

  location / {
    try_files $uri $uri/ /index.html;     # unknown paths get the app, and its router takes over
  }

  # Always check for a fresh index.html, so after a rebuild the browser never runs old files
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Built files have a hash in their name that changes on every build, so they can be cached for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}